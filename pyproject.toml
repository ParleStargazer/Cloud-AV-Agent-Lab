[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-av-agent-lab"
version = "0.1.0"
description = "Safe local orchestration framework for cloud-isolated AV sample testing workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
guest-agent = [
  "fastapi",
  "httpx",
  "psutil",
  "uvicorn",
  "pydantic",
]
guest-agent-build = [
  "pyinstaller",
]

[project.scripts]
cloud-av-agent-lab = "cloud_av_agent_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
